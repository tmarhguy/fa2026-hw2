apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ollama-webui
  labels:
    app.kubernetes.io/name: ollama-webui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-webui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-webui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: webui
          image: "{{ .Values.webui.image.repository }}:{{ .Values.webui.image.tag }}"
          imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.webui.service.port }}
              protocol: TCP
          env:
            - name: OLLAMA_BASE_URL
              value: "http://{{ .Release.Name }}-ollama:{{ .Values.service.port }}"
            - name: WEBUI_AUTH
              value: "false"
            - name: RAG_EMBEDDING_ENGINE
              value: "ollama"
            - name: RAG_OLLAMA_BASE_URL
              value: "http://{{ .Release.Name }}-ollama:{{ .Values.service.port }}"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
