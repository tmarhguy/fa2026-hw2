apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama-webui
  labels:
    app.kubernetes.io/name: ollama-webui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.webui.service.type }}
  selector:
    app.kubernetes.io/name: ollama-webui
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.webui.service.port }}
      targetPort: http
      protocol: TCP
