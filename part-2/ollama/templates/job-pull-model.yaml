apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pull-model
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6 # we've set this up for you as a reasonable default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull-model
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: OLLAMA_HOST
              value: "http://{{ .Release.Name }}-ollama:{{ .Values.service.port }}"
          command:
            - sh
            - -c
            - |
              until ollama list >/dev/null 2>&1; do
                echo "waiting for ollama server at $OLLAMA_HOST..."
                sleep 3
              done
              ollama pull {{ .Values.model.name }}
